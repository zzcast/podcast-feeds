name: Update podcast feeds
on:
  schedule:
    # 06:17, 12:17, 17:17 at UTC+3: fresh before the morning and evening listens.
    - cron: "17 3,9,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-feeds
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 update_feeds.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- *.xml
          git diff --cached --quiet || git commit -m "chore(feeds): update from upstream"
          git pull --rebase
          git push
